name: Testes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Testes (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-24.04
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências gráficas do Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xauth xvfb
      - name: Instalar projeto
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compilar fontes
        run: python -m compileall -q src tests
      - name: Verificar lint
        run: python -m ruff check src tests
      - name: Verificar formatação
        run: python -m ruff format --check src tests
      - name: Verificar tipos
        run: python -m mypy
      - name: Executar testes e cobertura
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
      - name: Validar scripts Linux
        if: runner.os == 'Linux'
        run: bash -n scripts/start.sh scripts/setup.sh
      - name: Testar launcher Linux
        if: runner.os == 'Linux'
        run: AI_LIMITS_PYTHON=python bash scripts/start.sh --help
      - name: Executar smoke gráfico com Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" env AI_LIMITS_RUN_TK_SMOKE=1 python -m unittest discover -s tests -p test_tk_smoke.py -v
